[package]
edition = "2024"
name = "ipc"
version = "0.1.0"
authors = ["Michael Schöttner <michael.schoettner@hhu.de>, Fabian Ruhland <ruhland@hhu.de>"]

[lib]
test = false
doctest = false
bench = false

[dependencies]
prost = { version = "0.14.1", default-features = false, features = ["derive"]  }
bytes = { version = "1.0", default-features = false }
# Local dependencies
syscall = { path = "../syscall" }

[build-dependencies]
built = { version = "0.7.7", features = ["chrono", "git2"] }
prost = "0.14.1"
prost-build = "0.14.1"
prost-types = "0.14.1"
quote = "1.0"
